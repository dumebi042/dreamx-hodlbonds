# Cloud Build configuration for blockchain executor
# This builds Docker images on push to stage/main branches
# Images are pushed to Google Container Registry

steps:
  # Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/blockchain-executor:$BRANCH_NAME"
      - "-t"
      - "gcr.io/$PROJECT_ID/blockchain-executor:$BRANCH_NAME-$SHORT_SHA"
      - "-f"
      - "apps/executor/Dockerfile"
      - "."

  # Push images to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/blockchain-executor:$BRANCH_NAME"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/blockchain-executor:$BRANCH_NAME-$SHORT_SHA"

# Images to push
images:
  - "gcr.io/$PROJECT_ID/blockchain-executor:$BRANCH_NAME"
  - "gcr.io/$PROJECT_ID/blockchain-executor:$BRANCH_NAME-$SHORT_SHA"

# Build timeout
timeout: "1200s"

options:
  logging: CLOUD_LOGGING_ONLY
