# Cloud Build configuration for hodlbonds-api intake
# Triggers on push to stage/main branches
# Builds Docker image and deploys to Cloud Run with Cloud SQL access

steps:
  # Build Docker image with branch and commit tags
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/hodlbonds-intake:$BRANCH_NAME"
      - "-t"
      - "gcr.io/$PROJECT_ID/hodlbonds-intake:$BRANCH_NAME-$SHORT_SHA"
      - "-f"
      - "apps/intake/Dockerfile"
      - "."

  # Push branch tag
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/hodlbonds-intake:$BRANCH_NAME"

  # Push commit-specific tag
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/hodlbonds-intake:$BRANCH_NAME-$SHORT_SHA"

  # Deploy to Cloud Run with Cloud SQL connection
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "hodlbonds-intake-$BRANCH_NAME"
      - "--image=gcr.io/$PROJECT_ID/hodlbonds-intake:$BRANCH_NAME-$SHORT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=256Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--service-account=hodlbonds-api-intake@$PROJECT_ID.iam.gserviceaccount.com"
      # Cloud SQL connection (connector uses this via API, not Unix socket)
      - "--add-cloudsql-instances=$PROJECT_ID:us-central1:hodlbonds-api"
      # Environment variables for Cloud SQL Connector with IAM auth
      - "--set-env-vars=CLOUD_SQL_INSTANCE=$PROJECT_ID:us-central1:hodlbonds-api"
      - "--set-env-vars=DB_IAM_USER=hodlbonds-api-intake@$PROJECT_ID.iam"
      - "--set-env-vars=DB_NAME=hodlbonds_api_$BRANCH_NAME"
      - "--set-env-vars=DB_POOL_MAX=5"
      # Secrets from Secret Manager (JSON object: {"webhook-name": "whsec_..."})
      - "--set-secrets=ALCHEMY_SIGNING_KEYS=alchemy-signing-keys:latest"
      # Startup configuration
      - "--cpu-boost"
      - "--startup-probe=httpGet.path=/health,periodSeconds=10,failureThreshold=3"

# Images to store in Container Registry
images:
  - "gcr.io/$PROJECT_ID/hodlbonds-intake:$BRANCH_NAME"
  - "gcr.io/$PROJECT_ID/hodlbonds-intake:$BRANCH_NAME-$SHORT_SHA"

timeout: "1200s"

# Service account for Cloud Build to run as (needs permissions to push images, deploy to Cloud Run)
serviceAccount: "projects/$PROJECT_ID/serviceAccounts/hodlbonds-api-deployer@$PROJECT_ID.iam.gserviceaccount.com"

options:
  logging: CLOUD_LOGGING_ONLY
