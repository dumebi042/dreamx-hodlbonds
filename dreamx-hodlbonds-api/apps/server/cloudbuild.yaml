# Cloud Build configuration for hodlbonds-api server
# Triggers on push to stage/main branches
# Builds Docker image and deploys to Cloud Run

steps:
  # Build Docker image with branch and commit tags
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/hodlbonds-server:$BRANCH_NAME"
      - "-t"
      - "gcr.io/$PROJECT_ID/hodlbonds-server:$BRANCH_NAME-$SHORT_SHA"
      - "-f"
      - "apps/server/Dockerfile"
      - "."

  # Push branch tag
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/hodlbonds-server:$BRANCH_NAME"

  # Push commit-specific tag
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/hodlbonds-server:$BRANCH_NAME-$SHORT_SHA"

  # Deploy to Cloud Run
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "hodlbonds-server-$BRANCH_NAME"
      - "--image=gcr.io/$PROJECT_ID/hodlbonds-server:$BRANCH_NAME-$SHORT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=256Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--service-account=hodlbonds-api@$PROJECT_ID.iam.gserviceaccount.com"

# Images to store in Container Registry
images:
  - "gcr.io/$PROJECT_ID/hodlbonds-server:$BRANCH_NAME"
  - "gcr.io/$PROJECT_ID/hodlbonds-server:$BRANCH_NAME-$SHORT_SHA"

timeout: "1200s"

options:
  logging: CLOUD_LOGGING_ONLY
