[profile.default]
src = "src"
out = "out"
libs = ["lib"]
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
remappings = [
"@uniswap/v4-core/=lib/v4-core/",
"@uniswap/v4-periphery/=lib/v4-periphery/",
"@uniswap/permit2/=lib/permit2/",
"@uniswap/universal-router/=lib/universal-router/",
"@openzeppelin/=lib/openzeppelin-contracts/",
"@openzeppelin-upgradeable/=lib/openzeppelin-contracts-upgradeable/"
]
viaIr = true
optimizer = true
optimizer_runs = 200 
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[lint]
exclude_lints = ["mixed-case-function", "mixed-case-variable"]

[rpc_endpoints]
anvil = "https://127.0.0.1:8545"
avalanche-mainnet = "https://api.avax.network/ext/bc/C/rpc"
avalanche-fuji = "https://api.avax-test.network/ext/bc/C/rpc"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
monad-sepolia = "https://rpc.ankr.com/monad_testnet"
